<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Komorebi</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet">
   <link rel="stylesheet" href="/src/style.css">
</head>

<body
   class="bg-canvas text-charcoal min-h-screen flex flex-col justify-between selection:bg-terracotta selection:text-canvas">

   <header class="border-b border-border-subtle py-5 px-6 md:px-12 flex items-center justify-between">
      <a href="/index.html" class="font-serif text-2xl tracking-tight">Komorebi</a>
      <nav class="flex items-center space-x-8 text-sm font-medium">
         <a href="/about.html" class="hover:text-terracotta transition">About</a>
         <a href="/projects.html" class="hover:text-terracotta transition">Projects</a>
         <a href="/contact.html" class="text-terracotta font-semibold">Contact</a>
      </nav>
   </header>

   <main class="max-w-2xl mx-auto px-6 py-20 flex-grow w-full">
      <h1 class="font-serif text-5xl mb-3">Start a Project</h1>
      <p class="text-charcoal-muted mb-8 text-sm">Tell us about your site, your timeline, and your vision.</p>

      <form class="space-y-6">
         <div>
            <label class="block text-xs uppercase tracking-widest font-semibold mb-2">Name</label>
            <input type="text"
               class="w-full bg-transparent border border-border-subtle p-3 rounded-sm focus:outline-none focus:border-terracotta" />
         </div>
         <div>
            <label class="block text-xs uppercase tracking-widest font-semibold mb-2">Email</label>
            <input type="email"
               class="w-full bg-transparent border border-border-subtle p-3 rounded-sm focus:outline-none focus:border-terracotta" />
         </div>
         <div>
            <label class="block text-xs uppercase tracking-widest font-semibold mb-2">Project Brief</label>
            <textarea rows="4"
               class="w-full bg-transparent border border-border-subtle p-3 rounded-sm focus:outline-none focus:border-terracotta"></textarea>
         </div>
         <button type="submit"
            class="bg-terracotta hover:bg-terracotta-hover text-canvas px-8 py-3.5 text-xs uppercase tracking-widest font-semibold rounded-sm transition">
            Send Inquiry
         </button>
      </form>
   </main>

   <footer class="border-t border-border-subtle py-8 text-center text-xs text-charcoal-muted">
      &copy; 2026 Komorebi Studio.
   </footer>
</body>

</html>
